interface:
  display_name: "F8F"
  short_description: "Semantic n8n: make skills that ship assets by milestone"
  default_prompt: "Use $flowstep-harness-builder as F8F, a semantic n8n. Heavy premade tools in the project toolbox. Ship the skill by milestone. First audit (scripts/audit_harness.py --target <skill>) and return planning/flowstep-audit.md. Do not generate session code for crop/fetch/hash. Do not put product tools in ~/.codex/skills. The finished skill must produce an asset or a standardized workflow."
policy:
  allow_implicit_invocation: true
