interface:
  display_name: "M8M"
  short_description: "Write milestones, FlowSteps, tools, one table, one flowchart."
  default_prompt: "Use $m8m-harness-builder as a writer. Identify milestones, FlowSteps, and tools. Run scripts/audit_harness.py --target <skill> and return planning/m8m-flowchart.md plus the toolbox table. Scaffold stubs if asked. Do not treat validate/run as the product. A generate-new stub is a successful sketch."
policy:
  allow_implicit_invocation: true
