interface:
  display_name: "M8M"
  short_description: "Write milestones, FlowSteps, tools, one table, one flowchart."
  default_prompt: "Use $m8m-harness-builder as a writer. Identify milestones (compulsory harness + required asset), then FlowSteps inside each (atomic, prefer ONE tool, table order is a guide). Tools are optional; if a tool fails, recover like a normal agent. Missing the milestone asset is BLOCKED. Return planning/m8m-flowchart.md plus the FlowStep table. Generate-new stubs are a successful sketch."
policy:
  allow_implicit_invocation: true
